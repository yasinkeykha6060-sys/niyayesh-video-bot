name: Poll

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: video-bot-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U -r requirements.txt

      - name: Start YouTube token helper
        run: docker run -d --name bgutil --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || echo "pot server unavailable"

      - name: Open a clean network path
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          if ! apt-cache show cloudflare-warp >/dev/null 2>&1; then
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
          fi
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 4
          if curl -fsS --max-time 25 --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace; then
            echo "YT_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
            echo "clean network ready"
          else
            echo "clean network unavailable"
          fi

      - name: Listen
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PROXY: ${{ env.YT_PROXY }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          WATCH_SECONDS: "17400"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python bot.py --watch

      - name: Save state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update bot state"
            git push origin HEAD:main
          fi

      - name: Hand off to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --ref main
