name: Download

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat id
        required: true
        type: string
      url:
        description: YouTube URL
        required: true
        type: string
      mode:
        description: video, audio, or release
        required: true
        type: string
      quality:
        description: 360, 720, 1080, best, or audio
        required: true
        type: string
      message_id:
        description: Status message id
        required: true
        type: string
      video_id:
        description: YouTube video id
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: download-${{ inputs.chat_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -U -r requirements.txt

      - name: Start YouTube token helper
        run: docker run -d --name bgutil --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider || echo "pot server unavailable"

      - name: Open a clean network path
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          if ! apt-cache show cloudflare-warp >/dev/null 2>&1; then
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
          fi
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 4
          if curl -fsS --max-time 25 --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace; then
            echo "YT_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
            echo "clean network ready"
          else
            echo "clean network unavailable"
          fi

      - name: Download and send
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ github.token }}
          CHAT_ID: ${{ inputs.chat_id }}
          VIDEO_URL: ${{ inputs.url }}
          MODE: ${{ inputs.mode }}
          QUALITY: ${{ inputs.quality }}
          MESSAGE_ID: ${{ inputs.message_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python download.py

      - name: Save state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update download state"
            git push origin HEAD:main
          fi
