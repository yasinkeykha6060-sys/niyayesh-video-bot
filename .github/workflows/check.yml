name: Check download path

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install -U yt-dlp yt-dlp-ejs PySocks

      - name: Open a clean network path
        run: |
          set +e
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          if ! apt-cache show cloudflare-warp >/dev/null 2>&1; then
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update
          fi
          sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect
          sleep 4
          if curl -fsS --max-time 25 --proxy socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace; then
            echo "YT_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
            echo "clean network ready"
          else
            echo "clean network unavailable"
          fi

      - name: Ask YouTube for one public video
        env:
          YT_PROXY: ${{ env.YT_PROXY }}
        run: python check_download.py
